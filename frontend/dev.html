<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>開發者入口</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0e0f1c;
      color: #f5f5f5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .logo-container img {
      height: 3rem;
      width: auto;
    }
    h1 {
      font-size: 2.4rem;
      margin-bottom: 12px;
      text-align: center;
    }
    p {
      margin-bottom: 24px;
      line-height: 1.7;
      text-align: center;
    }
    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      background: #4A5F8C;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    a:hover {
      transform: translateY(-2px);
      background: #5A6F9C;
    }
    .links {
      display: grid;
      gap: 16px;
      margin-top: 24px;
      width: min(480px, 100%);
    }
    .links a {
      border-radius: 16px;
      padding: 16px 20px;
      text-align: left;
      background: rgba(74, 95, 140, 0.2);
      transition: all 0.3s ease;
    }
    .links a span {
      display: block;
      font-size: 0.95rem;
      opacity: 0.8;
      margin-top: 6px;
    }
    .links a:hover {
      background: rgba(74, 95, 140, 0.4);
      transform: translateY(-2px);
    }
    footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
    }
    footer a {
      background: none;
      padding: 0;
      color: #7FA8D9;
    }
    footer a:hover {
      color: #9FC8F9;
      transform: none;
    }
    @media (max-width: 768px) {
      .logo-container img {
        height: 2.5rem;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="assets/logo.png" alt="SkiDIY">
  </div>
  <h1>開發者入口</h1>
  <p>這裡整理了所有與 FAQ / Analytics / LLM 相關的開發資源與工具，協助工程師快速上線。</p>

    </a>
    <a href="docs.html?file=specs/001-faq-system-upgrade/spec.md">

    </a>
    <a href="docs.html?file=specs/001-faq-system-upgrade/plan.md">
      技術實作計畫
      <span>架構設計、任務拆解與風險控管</span>
    </a>
    <a href="docs.html?file=CLAUDE.md">
      Claude / AI 協作指南
      <span>如何使用內建 AI 助手協助開發與維運</span>
    </a>
  </div>
  <footer>
    返回 <a href="index.html" style="color:#5bd9ff;">FAQ 系統首頁</a>
  </footer>
</body>
</html>
