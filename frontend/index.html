    function getResortLocale(language) {
      const lang = language || currentLanguage || 'zh';
      return RESORT_LOCALE[lang] || RESORT_LOCALE.zh;
    }

    function getRegionDisplayName(region, language) {
      const locale = getResortLocale(language);
      return locale.regionNames[region] || region;
    }

    function getResortDisplayNames(resort, language) {
      const localeOrder = {
        zh: ['zh', 'en', 'th', 'ja'],
        en: ['en', 'zh', 'th', 'ja'],
        th: ['th', 'en', 'zh', 'ja']
      };
      const fallback = localeOrder[language] || ['zh', 'en', 'th', 'ja'];
      const names = resort.names || {};
      const primary = fallback.map(code => names[code]).find(Boolean) || names.zh || names.en || names.ja || resort.name || '';

      const secondaryFallback = {
        zh: ['en', 'th', 'ja'],
        en: ['zh', 'th', 'ja'],
        th: ['en', 'zh', 'ja']
      };
      const secondary = (secondaryFallback[language] || ['en', 'zh', 'ja'])
        .map(code => names[code])
        .find(name => name && name !== primary) || '';

      return { primary, secondary };
    }

    function formatDuration(minutes, language) {
      if (minutes === undefined || minutes === null) return '';
      const lang = language || currentLanguage || 'zh';
      if (lang === 'en') return `${minutes} min`;
      if (lang === 'th') return `${minutes} นาที`;
      return `${minutes}分鐘`;

    // Resolve link from link_registry or linkTokens
    // Supports: token (for FAQ), link_name with context (for resort)
    // Examples:
    //   resolveLink('LINK_SCHEDULE') -> 'https://booking.diy.ski/schedule'
    //   resolveLink('official_site', resort) -> 'https://www.example.com'
    //   resolveLink('google_maps', resort) -> 'https://maps.google.com/?q=...'
    function resolveLink(linkName, context = null) {
      let linkDef = null;
      let url = null;

      // Try to resolve from linkRegistry first (if loaded)
      if (linkRegistry) {
        // Check if it's a FAQ link token (e.g., LINK_SCHEDULE)
        if (linkRegistry.faq && linkRegistry.faq[linkName]) {
          url = linkRegistry.faq[linkName].url;
        }
        // Check if it's a resort link (e.g., official_site) with context
        else if (linkRegistry.resort && linkRegistry.resort[linkName] && context) {
          linkDef = linkRegistry.resort[linkName];
          if (linkDef.url_template) {
            // Replace {resort.*} variables with actual context values
            url = linkDef.url_template.replace(/\{resort\.([^}]+)\}/g, (match, path) => {
              // Handle nested properties like resort.coordinates.lat
              const parts = path.split('.');
              let value = context;
              for (const part of parts) {
                value = value?.[part];
              }
              return value || '';
            });
          }
        }
      }

      // Fallback to linkTokens from faq_kb.json for FAQ links
      if (!url && linkTokens[linkName]) {
        url = linkTokens[linkName];
      }

      if (!url) {
        console.warn(`[Link Resolver] Link not found: ${linkName}`, context);
        return null;
      }

      return url;
    }

    // Parse FAQ text with [LINK:TOKEN|LABEL] format
    function parseLinksInText(text) {
      if (!text) return '';

      // Replace [LINK:TOKEN|LABEL] with <a> tags
      return text.replace(/\[LINK:([A-Z_]+)\|([^\]]+)\]/g, (match, token, label) => {
        const url = resolveLink(token);
        if (!url) {
          console.warn(`[Link Parser] Token not found: ${token}`);
          return label; // Fallback to just the label text
        }

        // Sanitize label and URL
        const safeLabel = DOMPurify.sanitize(label);
        const safeUrl = DOMPurify.sanitize(url);

        // Handle mailto: links
        if (url.startsWith('mailto:')) {
          return `<a href="${safeUrl}" class="faq-link faq-link-email" onclick="event.stopPropagation()">${safeLabel}</a>`;
        }

        // Handle external links
        return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="faq-link faq-link-external" onclick="event.stopPropagation()">${safeLabel}</a>`;
      });
    }

    // Track FAQ views and clicks for analytics
    async function trackFAQView(faqId, clicked = false) {
      try {
        const trackData = {
          faq_id: faqId,
          clicked: clicked,
          language: currentLanguage,
          timestamp: new Date().toISOString()
        };

        // Save to localStorage if it's a click
        if (clicked) {
          try {
            let faqClicks = JSON.parse(localStorage.getItem('faq_clicks') || '[]');
            // If data is corrupted or not an array, reset it
            if (!Array.isArray(faqClicks)) {
              console.warn('[Analytics] Corrupted faq_clicks data detected, resetting...');
              faqClicks = [];
            }
            faqClicks.push(trackData);
            // Keep only last 100 clicks
            if (faqClicks.length > 100) {
              faqClicks.shift();
            }
            localStorage.setItem('faq_clicks', JSON.stringify(faqClicks));
            console.log('[Analytics] Saved FAQ click to localStorage:', trackData);
          } catch (e) {
            // If localStorage is corrupted, reset with current data
            console.warn('[Analytics] Failed to parse faq_clicks, resetting:', e);
            localStorage.setItem('faq_clicks', JSON.stringify([trackData]));
          }
        }

        // Send to backend
        await fetch(`${API_BASE}/analytics/track-faq-view`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(trackData)
        });
        console.log(`[Analytics] Tracked ${clicked ? 'click' : 'view'} for ${faqId}`);
      } catch (error) {
        console.warn('[Analytics] Failed to track FAQ view:', error);
        // Fail silently - analytics should not block user experience
      }
    }

    // Render resort regions in sidebar
    async function renderResortRegions() {
      try {
        // 使用後端 API 載入雪場資料
        let data = resortDataCache;
        if (!data) {
          const response = await fetch(`${API_BASE}/resort/all`);
          if (!response.ok) {
            console.warn('[Resorts] Failed to load resort list');
            return;
          }

          const result = await response.json();
          data = result.data || result;
          if (!data.resorts) {
            console.warn('[Resorts] Invalid resort data');
            return;
          }

          resortDataCache = data;
        }

        const locale = getResortLocale();

        // 按地區分組雪場
        const byRegion = {};
        data.resorts.forEach(resort => {
          const region = resort.region || 'Others';
          if (!byRegion[region]) {
            byRegion[region] = [];
          }
          byRegion[region].push(resort);
        });

        const regionsHTML = Object.entries(byRegion)
          .sort((a, b) => b[1].length - a[1].length) // 依雪場數量排序
          .map(([region, resorts]) => {
            const displayName = getRegionDisplayName(region);
            return `
              <div class="resort-region" data-region="${region}">
                <span>${DOMPurify.sanitize(displayName)}</span>
                <span class="resort-count">(${resorts.length})</span>
              </div>
            `;
          }).join('');

        document.getElementById('resortRegions').innerHTML = regionsHTML;

        // 點擊地區顯示雪場列表
        document.querySelectorAll('.resort-region').forEach(el => {
          el.addEventListener('click', () => {
            document.querySelectorAll('.resort-region').forEach(e => e.classList.remove('active'));
            el.classList.add('active');

            const region = el.dataset.region;

            // Track region click
            trackRegionClick(region);

            showResortsByRegion(region, byRegion[region]);
          });
        });

        if (activeResortRegion && byRegion[activeResortRegion]) {
          const activeEl = document.querySelector(`.resort-region[data-region="${activeResortRegion}"]`);
          if (activeEl) {
            activeEl.classList.add('active');
          }

          const totalPages = Math.max(1, Math.ceil(byRegion[activeResortRegion].length / RESORTS_PER_PAGE));
          const desiredPage = Math.min(currentResortPage || 1, totalPages);
          const modal = document.getElementById('resultsModal');
          if (modal && modal.classList.contains('show')) {
            renderResortPage(activeResortRegion, byRegion[activeResortRegion], desiredPage, totalPages);
            currentResortPage = desiredPage;

          activeResortRegion = null;
        }

        console.log(`[Resorts] Rendered ${Object.keys(byRegion).length} regions`);
      } catch (error) {
        console.error('[Resorts] Error loading resorts:', error);
      }
    }

    function renderResortPage(regionName, resorts, page, totalPages) {
      const locale = getResortLocale();
      const displayName = getRegionDisplayName(regionName);
      const startIdx = (page - 1) * RESORTS_PER_PAGE;
      const endIdx = startIdx + RESORTS_PER_PAGE;
      const pageResorts = resorts.slice(startIdx, endIdx);

      const title = locale.pagination.regionTitle(displayName, page, totalPages, resorts.length);
      const resortsHTML = pageResorts.map(resort => createResortCard(resort)).join('');

      const escapedRegion = regionName.replace(/'/g, "\\'");

      // 分頁控制按鈕
      const paginationHTML = totalPages > 1 ? `
        <div style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e5e7eb;">
          <button
            onclick="changePage(${page - 1}, '${escapedRegion}', ${JSON.stringify(resorts).replace(/"/g, '&quot;')}, ${totalPages})"
            ${page === 1 ? 'disabled' : ''}
            style="padding: 0.5rem 1rem; background: ${page === 1 ? '#ccc' : '#4A5F8C'}; color: white; border: none; border-radius: 8px; cursor: ${page === 1 ? 'not-allowed' : 'pointer'};">
            ${locale.pagination.prev}
          </button>
          <span style="color: #666;">${locale.pagination.pageStatus(page, totalPages)}</span>
          <button
            onclick="changePage(${page + 1}, '${escapedRegion}', ${JSON.stringify(resorts).replace(/"/g, '&quot;')}, ${totalPages})"
            ${page === totalPages ? 'disabled' : ''}
            style="padding: 0.5rem 1rem; background: ${page === totalPages ? '#ccc' : '#4A5F8C'}; color: white; border: none; border-radius: 8px; cursor: ${page === totalPages ? 'not-allowed' : 'pointer'};">
            ${locale.pagination.next}
          </button>
        </div>
      ` : '';

      displayResortsInModal(resortsHTML + paginationHTML, title);
    }

        return `<a href="${DOMPurify.sanitize(url)}" target="_blank" class="resort-link" onclick="event.stopPropagation(); trackResortEngagement(event, '${linkName}_click', '${resortCard.dataset.resortId}', '')" title="${DOMPurify.sanitize(label)}">
          ${icon} ${DOMPurify.sanitize(label)}
        </a>`;
      }).join(' | ');
    };

    // Create resort card HTML
    function createResortCard(resort) {
      const locale = getResortLocale();
      const { primary, secondary } = getResortDisplayNames(resort, currentLanguage);
      const regionDisplay = getRegionDisplayName(resort.region || '');

      const lifts = resort.snow_stats?.lifts ?? resort.lifts ?? '—';
      const courses = resort.snow_stats?.courses_total ?? resort.courses ?? '—';
      const nightSki = Boolean(resort.snow_stats?.night_ski ?? resort.night_ski);

      const pricing = resort.pricing || {};
      const amenities = resort.amenities || [];
      const officialSite = resort.official_site || '';
      const transportation = resort.transportation || null;

      // Prepare all resort links for future use (not displayed yet)
      // These will be shown once the data is available
      const resortLinks = {
        official_site: resolveLink('official_site', resort),
        booking_page: resolveLink('booking_page', resort),
        google_maps: resolveLink('google_maps', resort),
        snow_report: resort.snow_report_url ? resolveLink('snow_report', resort) : null
      };
      // Store links in data attribute for JavaScript access (not visible to user)
      const linksDataAttr = JSON.stringify(resortLinks).replace(/"/g, '&quot;');

      let adultPrice = pricing.one_day_adult ?? null;
      let childPrice = pricing.one_day_child ?? null;
      let pricingTypeLabel = '';

      if (Array.isArray(pricing.ticket_types)) {
        const dayTicket = pricing.ticket_types.find(ticket => /1-day/i.test(ticket.type)) || pricing.ticket_types[0];
        if (dayTicket) {
          pricingTypeLabel = dayTicket.type || '';
          if (adultPrice === null || adultPrice === undefined) {
            adultPrice = dayTicket.adult ?? dayTicket.general ?? dayTicket.price ?? null;
          }
          if (childPrice === null || childPrice === undefined) {
            childPrice = dayTicket.child ?? dayTicket.kid ?? dayTicket.junior ?? dayTicket.youth ?? null;
          }
        }
      }

      const priceParts = [];
      if (adultPrice !== null && adultPrice !== undefined) {
        priceParts.push(`${locale.pricing.adult} ¥${Number(adultPrice).toLocaleString()}`);
      }
      if (childPrice !== null && childPrice !== undefined) {
        priceParts.push(`${locale.pricing.child} ¥${Number(childPrice).toLocaleString()}`);
      }
      const pricingValue = priceParts.length > 0 ? priceParts.join(' / ') : locale.pricing.unavailable;

      let transportationSummary = '';
      if (transportation) {
        if (transportation.route) {
          transportationSummary = transportation.route;
          if (transportation.duration_minutes) {
            transportationSummary += ` (${formatDuration(transportation.duration_minutes, currentLanguage)})`;
          }
        } else if (Array.isArray(transportation.domestic?.shinkansen) && transportation.domestic.shinkansen.length > 0) {
          const first = transportation.domestic.shinkansen[0];
          const route = `${first.from || ''} → ${first.to || ''}`.trim();
          transportationSummary = route || transportationSummary;
          if (first.duration_minutes) {
            transportationSummary += ` (${formatDuration(first.duration_minutes, currentLanguage)})`;
          }
        } else if (Array.isArray(transportation.domestic?.bus) && transportation.domestic.bus.length > 0) {
          const firstBus = transportation.domestic.bus[0];
          transportationSummary = firstBus.route || '';
          if (firstBus.duration_minutes) {
            transportationSummary += ` (${formatDuration(firstBus.duration_minutes, currentLanguage)})`;
          }
        } else if (transportation.remarks) {
          transportationSummary = transportation.remarks;
        }
      }

      return `
        <div class="resort-card collapsible" data-resort-id="${resort.resort_id}" data-expanded="false" data-resort-links='${linksDataAttr}'>
          <div class="resort-header clickable" onclick="toggleResortCard(this)">
            <div>
              <div class="resort-name">
                <span class="expand-icon">▶</span>
                ${DOMPurify.sanitize(primary)}
              </div>
              ${secondary ? `<div class="resort-name-en">${DOMPurify.sanitize(secondary)}</div>` : ''}
            </div>
            <div class="resort-region-tag">${DOMPurify.sanitize(regionDisplay)}</div>
          </div>

          <div class="resort-details" style="display: none;">
          <div class="resort-stats">
            <div class="resort-stat">
              <div class="resort-stat-value">${lifts}</div>
              <div class="resort-stat-label">${locale.stats.lifts}</div>
            </div>
            <div class="resort-stat">
              <div class="resort-stat-value">${courses}</div>
              <div class="resort-stat-label">${locale.stats.courses}</div>
            </div>
            <div class="resort-stat">
              <div class="resort-stat-value">${locale.nightSkiValue(nightSki)}</div>
              <div class="resort-stat-label">${locale.stats.nightSki}</div>
            </div>
          </div>

          ${(priceParts.length > 0 || pricingTypeLabel) ? `
            <div class="resort-info">
              <div class="resort-info-row">
                <span class="resort-info-label">${locale.pricing.title}${pricingTypeLabel ? ` (${DOMPurify.sanitize(pricingTypeLabel)})` : ''}:</span>
                <span class="resort-info-value">${DOMPurify.sanitize(pricingValue)}</span>
              </div>
            </div>
          ` : ''}

          ${transportationSummary ? `
            <div class="resort-info">
              <div class="resort-info-row">
                <span class="resort-info-label">${locale.transportationLabel}:</span>
                <span class="resort-info-value">${DOMPurify.sanitize(transportationSummary || '')}</span>
              </div>
            </div>
          ` : ''}

          ${amenities.length > 0 ? `
            <div class="resort-amenities" id="amenities-${resort.resort_id}">
              ${amenities.slice(0, 15).map(a => `<span class="resort-amenity clickable" onclick="trackTagClick(event, 'resort', '${DOMPurify.sanitize(a)}', '${resort.resort_id}')">${DOMPurify.sanitize(getAmenityLabel(a, currentLanguage))}</span>`).join('')}
              ${amenities.length > 15 ? `
                <button onclick="toggleMoreAmenities('${resort.resort_id}', ${JSON.stringify(amenities).replace(/"/g, '&quot;')})"
                  style="background: #4A5F8C; color: white; border: none; padding: 0.25rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem;">
                  ${locale.toggles.more(amenities.length - 15)}
                </button>
              ` : ''}
            </div>
          ` : ''}

          ${officialSite || (linkRegistry && linkRegistry.resort && linkRegistry.resort.official_site) ? `
            <a href="${DOMPurify.sanitize(officialSite || resolveLink('official_site', resort) || '#')}" target="_blank" class="resort-link" onclick="trackResortEngagement(event, 'official_site_click', '${resort.resort_id}', '${DOMPurify.sanitize(primary)}')">
              ${locale.viewOfficialSite}
            </a>
          ` : ''}

          <div class="feedback-section">
            <span class="feedback-label">${currentLanguage === 'en' ? 'Was this helpful?' : currentLanguage === 'th' ? 'มีประโยชน์หรือไม่' : '這個資訊有幫助嗎？'}</span>
            <div class="feedback-buttons">
              <button class="btn-helpful" onclick="openFeedbackModal(this)" aria-label="${currentLanguage === 'en' ? 'Helpful' : currentLanguage === 'th' ? 'มีประโยชน์' : '有幫助'}">
                👍 ${currentLanguage === 'en' ? 'Helpful' : currentLanguage === 'th' ? 'มีประโยชน์' : '有幫助'}
              </button>
              <button class="btn-not-helpful" onclick="openFeedbackModal(this)" aria-label="${currentLanguage === 'en' ? 'Not helpful' : currentLanguage === 'th' ? 'ไม่มีประโยชน์' : '沒幫助'}">
                👎 ${currentLanguage === 'en' ? 'Not helpful' : currentLanguage === 'th' ? 'ไม่มีประโยชน์' : '沒幫助'}
              </button>
            </div>
          </div>
          </div>
        </div>
      `;
    }

    function displayResortsInModal(resortsHTML, title) {

      document.getElementById('modalResultsList').innerHTML = resortsHTML;

    // Filter resorts by amenity tag
    async function filterResortsByAmenity(amenity) {
      const locale = getResortLocale();
      try {
        let data = resortDataCache;
        if (!data) {
          const response = await fetch(`${API_BASE}/resort/all`);
          if (!response.ok) {
            console.warn('[Resorts] Failed to load resort list for filtering');
            alert(locale.alerts.loadError);
            return;
          }

          const result = await response.json();
          data = result.data || result;
          if (!data.resorts) {
            console.warn('[Resorts] Invalid resort data');
            alert(locale.alerts.loadError);
            return;
          }
          resortDataCache = data;
        }

        // Filter resorts by amenity
        const filtered = data.resorts.filter(resort =>
          resort.amenities && resort.amenities.includes(amenity)
        );

        const amenityLabel = getAmenityLabel(amenity, currentLanguage);

        if (filtered.length === 0) {
          alert(locale.alerts.amenityNotFound(amenityLabel));
          return;
        }

        console.log(`[Resorts] Found ${filtered.length} resorts with amenity: ${amenity}`);

        // 使用分頁顯示
        const totalPages = Math.ceil(filtered.length / RESORTS_PER_PAGE);
        renderFilteredResortsPage(amenity, filtered, 1, totalPages);

      } catch (error) {
        console.error('[Resorts] Error filtering by amenity:', error);
        alert(locale.alerts.loadError);
      }
    }

    // Render filtered resorts with pagination
    function renderFilteredResortsPage(amenity, resorts, page, totalPages) {
      const locale = getResortLocale();
      const startIdx = (page - 1) * RESORTS_PER_PAGE;
      const endIdx = startIdx + RESORTS_PER_PAGE;
      const pageResorts = resorts.slice(startIdx, endIdx);

      const amenityLabel = getAmenityLabel(amenity, currentLanguage);
      const title = locale.pagination.amenityTitle(amenityLabel, page, totalPages, resorts.length);
      const resortsHTML = pageResorts.map(resort => createResortCard(resort)).join('');
      const escapedAmenity = amenity.replace(/'/g, "\\'");

      // 分頁控制按鈕
      const paginationHTML = totalPages > 1 ? `
        <div style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e5e7eb;">
          <button
            onclick="changeFilteredPage(${page - 1}, '${escapedAmenity}', ${JSON.stringify(resorts).replace(/"/g, '&quot;')}, ${totalPages})"
            ${page === 1 ? 'disabled' : ''}
            style="padding: 0.5rem 1rem; background: ${page === 1 ? '#ccc' : '#4A5F8C'}; color: white; border: none; border-radius: 8px; cursor: ${page === 1 ? 'not-allowed' : 'pointer'};">
            ${locale.pagination.prev}
          </button>
          <span style="color: #666;">${locale.pagination.pageStatus(page, totalPages)}</span>
          <button
            onclick="changeFilteredPage(${page + 1}, '${escapedAmenity}', ${JSON.stringify(resorts).replace(/"/g, '&quot;')}, ${totalPages})"
            ${page === totalPages ? 'disabled' : ''}
            style="padding: 0.5rem 1rem; background: ${page === totalPages ? '#ccc' : '#4A5F8C'}; color: white; border: none; border-radius: 8px; cursor: ${page === totalPages ? 'not-allowed' : 'pointer'};">
            ${locale.pagination.next}
          </button>
        </div>
      ` : '';

      displayResortsInModal(resortsHTML + paginationHTML, title);
    }

    // Global function for filtered pagination
    window.changeFilteredPage = function(newPage, amenity, resorts, totalPages) {
      renderFilteredResortsPage(amenity, resorts, newPage, totalPages);
    };

    // Show single resort detail
    async function showResortDetail(resortId) {
      try {

    // Render hot FAQs (fetch from analytics API, fallback to manually marked)
    async function renderHotFAQs() {
      let hotFAQs = [];

      // Try to fetch hot FAQs from analytics API
      try {
        const response = await fetch(`${API_BASE}/analytics/hot-faqs?limit=5&days=30&language=${currentLanguage}`);
        if (response.ok) {
          const data = await response.json();
          if (data.success && data.data.hot_faqs && data.data.hot_faqs.length > 0) {
            // Map analytics data to FAQ objects
            const hotFaqIds = data.data.hot_faqs.map(item => item.faq_id);
            hotFAQs = allFAQs.filter(faq => hotFaqIds.includes(faq.id));
            // Sort by analytics ranking
            hotFAQs.sort((a, b) => hotFaqIds.indexOf(a.id) - hotFaqIds.indexOf(b.id));
            console.log(`[Hot FAQs] Loaded ${hotFAQs.length} FAQs from analytics (30 days)`);
          }
        } else {
          console.warn('[Hot FAQs] Analytics API returned status:', response.status);
        }
      } catch (error) {
        console.warn('[Hot FAQs] Failed to fetch from analytics, using fallback:', error);
      }

      // Fallback: Use manually marked hot FAQs
      if (hotFAQs.length === 0) {
        hotFAQs = allFAQs.filter(faq => faq.hot === true);
        console.log(`[Hot FAQs] Using ${hotFAQs.length} manually marked hot FAQs`);
      }

      // If still empty, use first 5 FAQs
      if (hotFAQs.length === 0) {
        hotFAQs = allFAQs.slice(0, 5);
        console.log('[Hot FAQs] No hot FAQs found, using first 5 FAQs');
      }

      // Limit to 5
      hotFAQs = hotFAQs.slice(0, 5);

      const hotHTML = hotFAQs.map(faq => {
        const localized = faqEngine.getLocalizedContent(faq, currentLanguage);
        const question = DOMPurify.sanitize(localized.question || faq.canonical_question || '');
        return `
        <div class="hot-faq-item" onclick="showFAQDetail('${faq.id}')">
          ${question}
        </div>
      `;
      }).join('');

      // Render to sidebar
      const hotFAQsEl = document.getElementById('hotFAQs');
      if (hotFAQsEl) {
        hotFAQsEl.innerHTML = hotHTML;
        console.log(`[Hot FAQs] Rendered ${hotFAQs.length} hot questions to sidebar`);
      } else {
        console.warn('[Hot FAQs] hotFAQs element not found');
      }
    }

    // Track section click
    async function trackSectionClick(section) {
      try {
        console.log(`[Section Click] Section: ${section}`);

        const sectionClick = {
          timestamp: new Date().toISOString(),
          section: section,
          language: currentLanguage
        };

        // Store in localStorage
        const clicks = JSON.parse(localStorage.getItem('sectionClicks') || '[]');
        clicks.push(sectionClick);
        if (clicks.length > 100) clicks.shift();
        localStorage.setItem('sectionClicks', JSON.stringify(clicks));

        // Try to send to backend
        await fetch(`${API_BASE}/analytics/track-section-click`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sectionClick)
        });
      } catch (error) {
        console.error('[Section Click] Error tracking:', error);
      }
    }

    // Search with Intent Detection
    async function performSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      document.getElementById('loadingState').classList.remove('hidden');
      document.getElementById('resultsSection').classList.add('hidden');
      hideIntentPanel();

      try {
        const startTime = performance.now();
        let intentData = null;

        // Try to call Intent Detection API (optional)
        try {
          const intentResponse = await fetch(`${API_BASE}/intent/analyze`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, contextual: true })
          });

          if (intentResponse.ok) {
            intentData = await intentResponse.json();
            console.log('[Search] Intent detection succeeded');
          } else {
            console.warn('[Search] Intent API returned status:', intentResponse.status);
          }
        } catch (intentError) {
          console.warn('[Search] Intent API unavailable:', intentError.message);
        }

        // Perform FAQ search (always required)
        const results = await faqEngine.search(query, { limit: 10 });
        const searchTime = Math.round(performance.now() - startTime);

        // Search resorts in parallel using local JSON
        let resortResults = [];
        try {
          let resortData = resortDataCache;
          if (!resortData) {
            const resortResponse = await fetch(`${API_BASE}/resort/all`);
            if (resortResponse.ok) {
              const result = await resortResponse.json();
              resortData = result.data || result;
              resortDataCache = resortData;
            } else {
              console.warn('[Search] Resort data request failed with status:', resortResponse.status);
            }
          }

          if (resortData?.resorts) {
            const queryLower = query.toLowerCase();

            resortResults = resortData.resorts.filter(resort => {
              const nameMatch = Object.values(resort.names || {})
                .some(name => typeof name === 'string' && name.toLowerCase().includes(queryLower));

              const amenityMatch = Array.isArray(resort.amenities) &&
                resort.amenities.some(a => typeof a === 'string' && a.toLowerCase().includes(queryLower));

              const regionCandidates = new Set();
              if (resort.region) {
                regionCandidates.add(resort.region);
              }
              Object.values(RESORT_LOCALE).forEach(locale => {
                const regionLabel = locale.regionNames[resort.region];
                if (regionLabel) {
                  regionCandidates.add(regionLabel);
                }
              });
              const regionMatch = Array.from(regionCandidates)
                .some(label => typeof label === 'string' && label.toLowerCase().includes(queryLower));

              return nameMatch || amenityMatch || regionMatch;
            }).map(resort => {
              const names = getResortDisplayNames(resort, currentLanguage);
              return {
                resort_id: resort.resort_id,
                name: names.primary,
                region: getRegionDisplayName(resort.region || ''),
              };
            });

            console.log(`[Search] Found ${resortResults.length} matching resorts for "${query}"`);
          }
        } catch (resortError) {
          console.warn('[Search] Resort search failed:', resortError);
        }

        // Display intent detection results if available
        if (intentData && intentData.data) {
          displayIntentResults(intentData.data);
        }

        // Display FAQ results (always)
        const faqs = results.map(r => ({...r.item, score: r.score}));
        const searchTitle = i18n ? i18n.t('search_results') : '搜尋結果';
        displayFAQs(faqs, searchTitle, searchTime, resortResults);

      } catch (error) {
        console.error('Search failed:', error);
        document.getElementById('loadingState').classList.add('hidden');
        alert('搜尋失敗: ' + error.message);
      }
    }

    // Display Intent Detection Results
    function displayIntentResults(data) {
      const panel = document.getElementById('intentPanel');
      const { intent, slots, recommendations } = data;

      // Update intent badge
      const intentName = intentNames[intent.primary] || intent.primary;
      document.getElementById('intentBadge').textContent = intentName;

      // Update confidence
      const confidence = Math.round(intent.confidence * 100);
      document.getElementById('intentConfidence').textContent = `信心度 ${confidence}%`;

      // Display slots
      const slotTags = document.getElementById('slotTags');
      const slotHTML = Object.entries(slots).map(([key, value]) => {
        const labels = {
          resort: '雪場',
          date: '日期',
          people_total: '人數',
          board_type: '板型',
          children_ages: '孩童年齡'
        };
        const displayValue = Array.isArray(value) ? value.join(', ') + '歲' : value;
        return `
          <div class="slot-tag">
            <span class="slot-label">${labels[key] || key}:</span>
            <span class="slot-value">${displayValue}</span>
          </div>
        `;
      }).join('');
      slotTags.innerHTML = slotHTML;

      // Display recommendations
      if (recommendations && recommendations.length > 0) {
        const recList = document.getElementById('recommendationsList');
        recList.innerHTML = recommendations.map(rec => `
          <div class="recommendation-item" onclick="showFAQDetail('${rec.faq_id}')">

    // Display FAQs
    function displayFAQs(faqs, title, searchTime = null, resortResults = []) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('resultsSection').classList.remove('hidden');

      const locale = getResortLocale();
      const totalResults = faqs.length + resortResults.length;
      const resultsLabel = i18n ? i18n.t('results_count', { count: totalResults }) : `找到 ${totalResults} 筆結果`;
      const breakdownLabel = locale.search.breakdown(faqs.length, resortResults.length);
      document.getElementById('resultCount').textContent = `${title}: ${resultsLabel} (${breakdownLabel})`;

      if (searchTime !== null && searchTime !== undefined) {
        const timeLabel = i18n ? i18n.t('response_time', { time: searchTime }) : `搜尋耗時: ${searchTime}ms`;
        document.getElementById('responseTime').textContent = timeLabel;
      } else {
        document.getElementById('responseTime').textContent = '';
      }

      // Render resort results first if any
      let resortsHTML = '';
      if (resortResults.length > 0) {
        resortsHTML = `
          <div style="margin-bottom: 2rem;">
            <h3 style="color: #2D395C; margin-bottom: 1rem; font-size: 1.2rem;">${locale.search.relatedTitle}</h3>
            ${resortResults.map(resort => {
              return `
                <div class="resort-region" style="cursor: pointer; margin: 0.5rem 0;"
                     onclick="showResortDetail('${resort.resort_id}')">
                  <span><strong>${DOMPurify.sanitize(resort.name || '')}</strong></span>
                  <span class="resort-count">${DOMPurify.sanitize(resort.region || '')}</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      const resultsHTML = faqs.map(faq => {
        const confidence = faq.score ? Math.round((1 - faq.score) * 100) : 100;
        const confidenceClass = confidence >= 80 ? 'confidence-high' :
                               confidence >= 60 ? 'confidence-medium' : 'confidence-low';

        const localized = faqEngine.getLocalizedContent(faq, currentLanguage);
        const question = DOMPurify.sanitize(localized.question || faq.canonical_question || '');
        const answer = parseLinksInText(localized.answer || '無答案內容');
        const postscript = localized.postscript
          ? `<div class="faq-postscript">${parseLinksInText(localized.postscript)}</div>`
          : '';

        // Render tags if available
        const tagsHTML = faq.crm_tags && faq.crm_tags.length > 0
          ? `<div class="faq-tags">
              ${faq.crm_tags.map(tag => {
                const displayTag = DOMPurify.sanitize(getFaqTagLabel(tag, currentLanguage));
                return `<span class="faq-tag" onclick="trackTagClick(event, 'faq', '${DOMPurify.sanitize(tag)}', '${faq.id}')">${displayTag}</span>`;
              }).join('')}
            </div>`
          : '';

        return `
          <div class="faq-item" data-faq-id="${faq.id}">
            <div class="faq-header">
              <div class="faq-question">
                ${question}
                <span class="confidence-badge ${confidenceClass}">
                  信心度 ${confidence}%
                </span>
              </div>
              <span class="faq-toggle-icon">▼</span>
            </div>
            ${tagsHTML}
            <div class="faq-answer">
              ${answer}
              ${postscript}
            </div>
            <div class="feedback-section">
              <span class="feedback-label">${currentLanguage === 'en' ? 'Was this helpful?' : currentLanguage === 'th' ? 'มีประโยชน์หรือไม่' : '這個資訊有幫助嗎？'}</span>
              <div class="feedback-buttons">
                <button class="btn-helpful" onclick="openFeedbackModal(this)" aria-label="${currentLanguage === 'en' ? 'Helpful' : currentLanguage === 'th' ? 'มีประโยชน์' : '有幫助'}">
                  👍 ${currentLanguage === 'en' ? 'Helpful' : currentLanguage === 'th' ? 'มีประโยชน์' : '有幫助'}
                </button>
                <button class="btn-not-helpful" onclick="openFeedbackModal(this)" aria-label="${currentLanguage === 'en' ? 'Not helpful' : currentLanguage === 'th' ? 'ไม่มีประโยชน์' : '沒幫助'}">
                  👎 ${currentLanguage === 'en' ? 'Not helpful' : currentLanguage === 'th' ? 'ไม่มีประโยชน์' : '沒幫助'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('resultsList').innerHTML = resortsHTML + resultsHTML;

      // Add click handlers for accordion
      document.querySelectorAll('.faq-item').forEach(item => {
        item.addEventListener('click', (e) => {
          toggleFAQItem(item);
        });
      });
    }

    // Track tag click (FAQ tags or Resort amenity tags)
    window.trackTagClick = async function(event, tagType, tagName, itemId) {
      event.stopPropagation(); // Prevent FAQ accordion from toggling

      console.log(`[Tag Click] Type: ${tagType}, Tag: ${tagName}, Item: ${itemId}`);

      // Track to analytics (will create endpoint later)
      try {
        // For now, just log to console and localStorage
        const tagClick = {
          timestamp: new Date().toISOString(),
          tag_type: tagType,  // 'faq' or 'resort'
          tag_name: tagName,
          item_id: itemId,
          language: currentLanguage
        };

        // Store in localStorage for now
        const tagClicks = JSON.parse(localStorage.getItem('tagClicks') || '[]');
        tagClicks.push(tagClick);
        // Keep only last 100 clicks
        if (tagClicks.length > 100) {
          tagClicks.shift();
        }
        localStorage.setItem('tagClicks', JSON.stringify(tagClicks));

        console.log('[Tag Click] Tracked successfully:', tagClick);

        // Try to send to backend if available
        try {
          await fetch(`${API_BASE}/analytics/track-tag-click`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(tagClick)
          });
        } catch (err) {
          console.warn('[Tag Click] Backend tracking unavailable:', err.message);
        }

        // Filter by this tag
        if (tagType === 'faq') {
          filterFAQsByTag(tagName);
        } else if (tagType === 'resort') {
          filterResortsByAmenity(tagName);
        }
      } catch (error) {
        console.error('[Tag Click] Error tracking:', error);
      }
    };

    // ==================== AI Chat Widget ====================

    function initAIChatWidget() {
      console.log('[AI Chat] Initializing AI chat widget...');

      const toggleBtn = document.getElementById('aiChatToggle');
      const chatWindow = document.getElementById('aiChatWindow');
      const chatInput = document.getElementById('aiChatInput');
      const sendBtn = document.getElementById('aiChatSend');
      const messagesContainer = document.getElementById('aiChatMessages');

      // Toggle chat window
      toggleBtn.addEventListener('click', () => {
        chatWindow.classList.toggle('open');
        toggleBtn.classList.toggle('active');

        if (chatWindow.classList.contains('open')) {
          toggleBtn.textContent = '✕';
          chatInput.focus();
        } else {
          toggleBtn.textContent = '💬';
        }
      });

      // Send message on button click
      sendBtn.addEventListener('click', sendMessage);

      // Send message on Enter key
      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      async function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;

        // Add user message to chat
        addMessageToChat('user', message);
        chatInput.value = '';
        sendBtn.disabled = true;

        // Scroll to bottom
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
          // Search FAQ for relevant answers
          const results = await faqEngine.search(message);

          // Generate AI response
          let response = '';

          if (results.length > 0) {
            const topResult = results[0];
            const confidence = Math.round((1 - topResult.score) * 100);

            if (confidence >= 70) {
              // High confidence - provide direct answer
              response = `我找到了相關答案（信心度 ${confidence}%）：\n\n${topResult.item.answer_template.text}`;

              if (topResult.item.answer_template.postscript) {
                response += `\n\n${topResult.item.answer_template.postscript}`;
              }
            } else {
              // Lower confidence - suggest FAQs
              response = `我找到了一些可能相關的問題：\n\n`;
              results.slice(0, 3).forEach((result, index) => {
                const conf = Math.round((1 - result.score) * 100);
                response += `${index + 1}. ${result.item.canonical_question} (${conf}%)\n`;
              });
              response += `\n您可以點選左側搜尋來查看詳細答案。`;
            }
          } else {
            // No results found
            response = '抱歉，我沒有找到直接相關的答案。您可以嘗試：\n\n1. 換個方式描述您的問題\n2. 瀏覽左側的分類清單\n3. 查看熱門問題\n4. 聯繫我們的客服團隊：service@diy.ski';
          }

          // Add AI response to chat
          setTimeout(() => {
            addMessageToChat('assistant', response);
            sendBtn.disabled = false;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
          }, 500);

        } catch (error) {
          console.error('[AI Chat] Error:', error);
          addMessageToChat('assistant', '抱歉，處理您的問題時發生錯誤。請稍後再試。');
          sendBtn.disabled = false;
        }
      }

      function addMessageToChat(role, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `ai-chat-message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '👤' : '🤖';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(bubble);

        messagesContainer.appendChild(messageDiv);
      }

      console.log('[AI Chat] AI chat widget initialized');
    }

            return; // Already initialized
          }

          // Initialize with minimal data if FAQ engine times out
          console.warn('[SEO] FAQ engine did not load, initializing with minimal SEO');
          SEOMeta.initMainPageSEO(currentLang);
        }, 5000);
      }

      // Handle language switching for SEO updates
      const langSelector = document.querySelector('.language-selector select');
      if (langSelector && typeof HrefLangManager !== 'undefined') {
        langSelector.addEventListener('change', (e) => {
          const newLang = e.target.value;

          // Update hreflang tags for new language
          HrefLangManager.updateLanguageVersion(newLang);

          // Update page meta for new language
          if (typeof SEOMeta !== 'undefined') {
            setTimeout(() => {
              SEOMeta.initMainPageSEO(newLang, window.faqEngine?.faqData?.items);
              console.log(`[SEO] Language changed to ${newLang}`);
            }, 100);
          }
        });
      }

      // ============================================
      // 反饋系統初始化
      // ============================================
      initializeFeedbackSystem();
      syncLocalFeedbacks();
    });
  </script>

  <!-- 反饋系統 JavaScript -->
  <script>
    // 反饋狀態全局變數
    let currentFeedback = {
      type: null,        // 'faq' or 'resort'
      itemId: null,
      helpful: null,
      reason: null,
      comment: null,
      sessionId: null
    };

    /**
     * 初始化反饋系統
     */
    function initializeFeedbackSystem() {
      // 彈窗外點擊關閉
      const modal = document.getElementById('feedbackModal');
      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target.id === 'feedbackModal') {
            closeFeedbackModal();
          }
        });
      }

      // ESC 鍵關閉彈窗
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal && modal.style.display !== 'none') {
          closeFeedbackModal();
        }
      });

      console.log('[Feedback] System initialized');
    }

    /**
     * 打開反饋彈窗
     */
    function openFeedbackModal(buttonElement) {
      // 獲取 FAQ 或雪場信息
      const card = buttonElement.closest('.faq-item, .resort-card');
      if (!card) {
        console.warn('[Feedback] 無法找到卡片元素');
        return;
      }

      const isFAQ = card.classList.contains('faq-item');

      currentFeedback.type = isFAQ ? 'faq' : 'resort';
      currentFeedback.itemId = isFAQ ? card.dataset.faqId : card.dataset.resortId;
      currentFeedback.helpful = buttonElement.classList.contains('btn-helpful');
      currentFeedback.sessionId = getOrCreateSessionId();

      // 顯示對應的提示文本（支持多語言）
      const promptEl = document.getElementById('feedbackPrompt');
      if (currentFeedback.helpful) {
        if (currentLanguage === 'en') {
          promptEl.textContent = 'Great! Thank you for your feedback 😊';
        } else if (currentLanguage === 'th') {
          promptEl.textContent = 'ยอดเยี่ยม! ขอบคุณสำหรับความเห็นของคุณ 😊';
        } else {
          promptEl.textContent = '太好了！感謝您的肯定 😊';
        }
      } else {
        if (currentLanguage === 'en') {
          promptEl.textContent = 'Sorry we couldn\'t help. Can you tell us why?';
        } else if (currentLanguage === 'th') {
          promptEl.textContent = 'ขออภัยที่เราไม่สามารถช่วยได้ คุณช่วยบอกเหตุผลได้ไหม';
        } else {
          promptEl.textContent = '抱歉沒有幫到您，能告訴我們原因嗎？';
        }
      }

      // 控制原因選項顯示（只在「沒幫助」時顯示）
      const reasonsSection = document.getElementById('reasonsSection');
      reasonsSection.style.display = currentFeedback.helpful ? 'none' : 'block';

      // 更新模態框文字（多語言）
      updateFeedbackModalText();

      // 清空之前的選擇
      document.querySelectorAll('input[name="reason"]').forEach(el => el.checked = false);
      document.getElementById('feedbackComment').value = '';

      // 顯示彈窗
      document.getElementById('feedbackModal').style.display = 'flex';
      console.log('[Feedback] Modal opened for', currentFeedback.type, currentFeedback.itemId);
    }

    /**
     * 更新反饋模態框的多語言文字
     */
    function updateFeedbackModalText() {
      const lang = currentLanguage || 'zh';

      // 模態框標題
      const titleEl = document.getElementById('feedbackModalTitle');
      if (lang === 'en') {
        titleEl.textContent = '😊 Thank You for Your Feedback';
      } else if (lang === 'th') {
        titleEl.textContent = '😊 ขอบคุณสำหรับความคิดเห็น';
      } else {
        titleEl.textContent = '😊 感謝您的反饋';
      }

      // 原因標題
      const reasonsTitleEl = document.getElementById('reasonsTitle');
      if (lang === 'en') {
        reasonsTitleEl.textContent = 'What would you like to improve? (Optional)';
      } else if (lang === 'th') {
        reasonsTitleEl.textContent = 'คุณต้องการปรับปรุงอะไร (ไม่บังคับ)';
      } else {
        reasonsTitleEl.textContent = '希望改進什麼？（可選）';
      }

      // 原因選項
      const reasonTexts = document.querySelectorAll('.reason-text');
      const reasons = {
        zh: ['訊息不完整', '訊息過時', '難以理解', '找錯了問題', '其他'],
        en: ['Incomplete info', 'Outdated info', 'Hard to understand', 'Wrong question', 'Other'],
        th: ['ข้อมูลไม่ครบ', 'ข้อมูลล้าสมัย', 'เข้าใจยาก', 'คำถามผิด', 'อื่นๆ']
      };
      reasonTexts.forEach((el, index) => {
        el.textContent = reasons[lang][index];
      });

      // 評論標籤
      const commentLabelEl = document.getElementById('commentLabel');
      if (lang === 'en') {
        commentLabelEl.textContent = 'Any other suggestions? (Optional)';
      } else if (lang === 'th') {
        commentLabelEl.textContent = 'มีข้อเสนอแนะอื่นๆ หรือไม่ (ไม่บังคับ)';
      } else {
        commentLabelEl.textContent = '有其他建議嗎？（可選）';
      }

      // 評論佔位符
      const commentEl = document.getElementById('feedbackComment');
      if (lang === 'en') {
        commentEl.placeholder = 'e.g., Need more details...';
      } else if (lang === 'th') {
        commentEl.placeholder = 'เช่น ต้องการรายละเอียดเพิ่มเติม...';
      } else {
        commentEl.placeholder = '例：需要更詳細說明...';
      }

      // 按鈕文字
      const btnCancelEl = document.getElementById('btnCancel');
      const btnSubmitEl = document.getElementById('btnSubmit');
      if (lang === 'en') {
        btnCancelEl.textContent = 'Skip';
        btnSubmitEl.textContent = 'Submit';
      } else if (lang === 'th') {
        btnCancelEl.textContent = 'ข้าม';
        btnSubmitEl.textContent = 'ส่ง';
      } else {
        btnCancelEl.textContent = '跳過';
        btnSubmitEl.textContent = '提交反饋';
      }
    }

    /**
     * 關閉反饋彈窗
     */
    function closeFeedbackModal() {
      document.getElementById('feedbackModal').style.display = 'none';
      // 重置狀態
      currentFeedback = {
        type: null,
        itemId: null,
        helpful: null,
        reason: null,
        comment: null,
        sessionId: null
      };
      console.log('[Feedback] Modal closed');
    }

    /**
     * 提交反饋到後端
     */
    async function submitFeedback() {
      const reasonRadio = document.querySelector('input[name="reason"]:checked');
      const comment = document.getElementById('feedbackComment').value.trim();

      currentFeedback.reason = reasonRadio ? reasonRadio.value : null;
      currentFeedback.comment = comment || null;

      // 禁用提交按鈕（防止重複提交）
      const submitBtn = document.querySelector('.btn-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      // Always save to localStorage first (for analytics display)
      saveLocalFeedback();

      try {
        const response = await fetch(`${API_BASE}/analytics/feedback`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            feedback_type: currentFeedback.type,
            item_id: currentFeedback.itemId,
            helpful: currentFeedback.helpful,
            reason: currentFeedback.reason,
            comment: currentFeedback.comment,
            language: currentLanguage || 'zh'
          })
        });

        if (!response.ok) {
          throw new Error(`API 錯誤: ${response.status}`);
        }

        const data = await response.json();
        console.log('[Feedback] 提交成功:', data);

        // Mark as synced in localStorage
        try {
          const feedbacks = JSON.parse(localStorage.getItem('localFeedbacks') || '[]');
          if (feedbacks.length > 0 && !feedbacks[feedbacks.length - 1].synced) {
            feedbacks[feedbacks.length - 1].synced = true;
            localStorage.setItem('localFeedbacks', JSON.stringify(feedbacks));
          }
        } catch (e) {
          console.warn('[Feedback] Failed to mark as synced:', e);
        }

        // 成功提交
        closeFeedbackModal();
        showSuccessMessage();

      } catch (error) {
        console.error('[Feedback] 提交失敗:', error);
        // Already saved to localStorage above
        closeFeedbackModal();
        showSuccessMessage('（已本地保存）');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交反饋';
      }
    }

    /**
     * 顯示成功提示
     */
    function showSuccessMessage(suffix = '') {
      const message = document.createElement('div');
      message.className = 'feedback-success';

      let text = '感謝您的反饋！';
      if (currentLanguage === 'en') {
        text = 'Thank you for your feedback!';
      } else if (currentLanguage === 'th') {
        text = 'ขอบคุณสำหรับความเห็นของคุณ';
      }

      message.textContent = text + suffix;
      document.body.appendChild(message);

      // 3 秒後自動移除
      setTimeout(() => {
        message.remove();
      }, 3000);
    }

    /**
     * 本地保存反饋（後備方案）
     */
    function saveLocalFeedback() {
      try {
        let feedbacks = JSON.parse(localStorage.getItem('localFeedbacks') || '[]');
        // If data is corrupted or not an array, reset it
        if (!Array.isArray(feedbacks)) {
          console.warn('[Feedback] Corrupted localFeedbacks data detected, resetting...');
          feedbacks = [];
        }
        feedbacks.push({
          ...currentFeedback,
          timestamp: new Date().toISOString(),
          synced: false
        });

        // 只保留最近 100 條記錄
        if (feedbacks.length > 100) {
          feedbacks.shift();
        }

        localStorage.setItem('localFeedbacks', JSON.stringify(feedbacks));
        console.log('[Feedback] 本地保存:', feedbacks.length, '條記錄');
      } catch (e) {
        // If localStorage is corrupted, reset with current data
        console.warn('[Feedback] Failed to parse localFeedbacks, resetting:', e);
        localStorage.setItem('localFeedbacks', JSON.stringify([{
          ...currentFeedback,
          timestamp: new Date().toISOString(),
          synced: false
        }]));
      }
    }

    /**
     * 同步本地保存的反饋到後端
     */
    async function syncLocalFeedbacks() {
      try {
        let feedbacks = JSON.parse(localStorage.getItem('localFeedbacks') || '[]');
        // If data is corrupted or not an array, reset it
        if (!Array.isArray(feedbacks)) {
          console.warn('[Feedback Sync] Corrupted localFeedbacks data detected, resetting...');
          feedbacks = [];
          localStorage.setItem('localFeedbacks', JSON.stringify(feedbacks));
          return;
        }

        const unsynced = feedbacks.filter(f => !f.synced);

        if (unsynced.length === 0) return;

        console.log('[Feedback] 開始同步', unsynced.length, '條本地反饋');

        for (let i = 0; i < unsynced.length; i++) {
          const feedback = unsynced[i];
          try {
            const response = await fetch(`${API_BASE}/analytics/feedback`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                feedback_type: feedback.type,
                item_id: feedback.itemId,
                helpful: feedback.helpful,
                reason: feedback.reason,
                comment: feedback.comment,
                language: feedback.language || 'zh'
              })
            });

            if (response.ok) {
              feedback.synced = true;
              console.log('[Feedback Sync] 成功同步:', feedback.itemId);
            }
          } catch (error) {
            console.warn('[Feedback Sync] 同步失敗:', error);
            // 保持 synced = false，稍後重試
          }
        }

        // 保存更新狀態
        localStorage.setItem('localFeedbacks', JSON.stringify(feedbacks));
        const syncedCount = feedbacks.filter(f => f.synced).length;
        console.log('[Feedback] 同步完成:', syncedCount, '/', feedbacks.length);
      } catch (e) {
        console.error('[Feedback Sync] Failed to sync feedbacks:', e);
        // Reset corrupted data
        localStorage.setItem('localFeedbacks', JSON.stringify([]));
      }
    }

    /**
     * 獲取或創建會話ID（用於匿名追蹤）
     */
    function getOrCreateSessionId() {
      let sessionId = sessionStorage.getItem('feedbackSessionId');
      if (!sessionId) {
        sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        sessionStorage.setItem('feedbackSessionId', sessionId);
      }
      return sessionId;
    }
  </script>
